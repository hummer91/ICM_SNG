# ICM SNG 포커 학습 앱 Nginx 설정 (HTTP 전용 - SSL 설치 전 임시 설정)
# 
# SSL 인증서 설치 후 nginx-icm-sng.conf로 교체하세요

server {
    listen 80;
    listen [::]:80;
    
    # 도메인 설정
    server_name icm.slotrogue.monster;
    
    # 웹 루트 디렉토리
    root /home/linuxuser_2/var/www/html/ICM_SNG;
    
    # 기본 인덱스 파일
    index index.html;
    
    # 로그 설정
    access_log /var/log/nginx/icm-sng-access.log;
    error_log /var/log/nginx/icm-sng-error.log;
    
    # gzip 압축 설정
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1000;
    
    # 정적 파일 캐싱
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 프로덕션 설정 (정적 파일 서빙)
    location / {
        try_files $uri $uri/ /index.html;
        
        # 기본 보안 헤더
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;" always;
    }
    
    # 404 에러 페이지
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}