# ICM SNG 포커 학습 앱 Nginx 설정
# 
# 이 파일을 /etc/nginx/sites-available/에 복사하고
# sites-enabled에 심볼릭 링크를 생성하여 활성화하세요

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    
    server_name icm.slotrogue.monster;
    
    # HTTP to HTTPS redirect
    return 301 https://$server_name$request_uri;
}

# HTTPS server (SSL 설정은 certbot이 자동으로 추가함)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    
    # 도메인 설정
    server_name icm.slotrogue.monster;
    
    # SSL 설정 (certbot이 자동으로 추가함)
    # ssl_certificate와 ssl_certificate_key는 certbot이 추가합니다
    
    # SSL 최적화 설정
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # 웹 루트 디렉토리
    root /home/linuxuser_2/var/www/html/ICM_SNG;
    
    # 기본 인덱스 파일
    index index.html;
    
    # 로그 설정
    access_log /var/log/nginx/icm-sng-access.log;
    error_log /var/log/nginx/icm-sng-error.log;
    
    # gzip 압축 설정
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1000;
    
    # 정적 파일 캐싱
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Vite 개발 서버용 설정 (개발 환경에서만 사용)
    # location / {
    #     proxy_pass http://localhost:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }
    
    # 프로덕션 설정 (정적 파일 서빙)
    location / {
        try_files $uri $uri/ /index.html;
        
        # 보안 헤더 (HTTPS)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:;" always;
    }
    
    # API 경로 (향후 백엔드 추가시)
    # location /api/ {
    #     proxy_pass http://localhost:3001/;
    #     proxy_http_version 1.1;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header Host $http_host;
    #     proxy_set_header X-NginX-Proxy true;
    #     proxy_redirect off;
    # }
    
    # 404 에러 페이지
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# SSL 설정 (Let's Encrypt 사용시)
# certbot을 사용하여 자동으로 추가됨
# sudo certbot --nginx -d icm.yourdomain.com