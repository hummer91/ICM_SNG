# ICM SNG Poker - Nginx 보안 설정

server {
    listen 80;
    server_name icm-sng.com www.icm-sng.com;
    
    # HTTP를 HTTPS로 리다이렉트
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name icm-sng.com www.icm-sng.com;
    
    # SSL 인증서 경로 (Let's Encrypt 사용 권장)
    ssl_certificate /etc/letsencrypt/live/icm-sng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icm-sng.com/privkey.pem;
    
    # SSL 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy
    set $csp "default-src 'self'; ";
    set $csp "${csp}script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; ";
    set $csp "${csp}style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; ";
    set $csp "${csp}img-src 'self' data: blob: https:; ";
    set $csp "${csp}font-src 'self' https://fonts.gstatic.com data:; ";
    set $csp "${csp}connect-src 'self' https://api.icm-sng.com https://*.sentry.io https://app.posthog.com wss://localhost:* ws://localhost:*; ";
    set $csp "${csp}form-action 'self'; ";
    set $csp "${csp}frame-ancestors 'none'; ";
    set $csp "${csp}base-uri 'self'; ";
    set $csp "${csp}object-src 'none'; ";
    set $csp "${csp}media-src 'self'; ";
    set $csp "${csp}worker-src 'self' blob:; ";
    set $csp "${csp}frame-src 'none'; ";
    set $csp "${csp}manifest-src 'self';";
    
    add_header Content-Security-Policy $csp always;
    
    # Permissions Policy (이전 Feature-Policy)
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    
    # 루트 디렉토리
    root /var/www/html/ICM_SNG;
    
    # 인덱스 파일
    index index.html;
    
    # gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # 정적 파일 캐싱
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # 보안 헤더는 모든 응답에 포함
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    
    # SPA 라우팅 지원
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # API 프록시 (필요한 경우)
    location /api/ {
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 숨김 파일 접근 차단
    location ~ /\. {
        deny all;
        return 404;
    }
    
    # 설정 파일 접근 차단
    location ~ \.(json|md|lock|yaml|yml)$ {
        deny all;
        return 404;
    }
    
    # 소스 파일 접근 차단
    location ~ /src/ {
        deny all;
        return 404;
    }
    
    # 에러 페이지
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}