# ICM SNG Poker - Apache 보안 설정

<VirtualHost *:80>
    ServerName icm-sng.com
    ServerAlias www.icm-sng.com
    
    # HTTP를 HTTPS로 리다이렉트
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName icm-sng.com
    ServerAlias www.icm-sng.com
    
    # SSL 설정
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/icm-sng.com/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/icm-sng.com/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/icm-sng.com/chain.pem
    
    # SSL 프로토콜 설정
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder on
    
    # 보안 헤더
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Content Security Policy
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://api.icm-sng.com https://*.sentry.io https://app.posthog.com wss://localhost:* ws://localhost:*; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; media-src 'self'; worker-src 'self' blob:; frame-src 'none'; manifest-src 'self';"
    
    # Permissions Policy
    Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    
    # 문서 루트
    DocumentRoot /var/www/html/ICM_SNG
    
    # 디렉토리 설정
    <Directory /var/www/html/ICM_SNG>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # SPA 라우팅 지원
        FallbackResource /index.html
    </Directory>
    
    # gzip 압축
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
        DeflateCompressionLevel 6
    </IfModule>
    
    # 정적 파일 캐싱
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType application/x-javascript "access plus 1 month"
        ExpiresByType image/x-icon "access plus 1 year"
        ExpiresByType application/font-woff2 "access plus 1 year"
        ExpiresByType application/font-woff "access plus 1 year"
        ExpiresByType application/vnd.ms-fontobject "access plus 1 year"
        ExpiresByType font/ttf "access plus 1 year"
    </IfModule>
    
    # 캐시 제어 헤더
    <IfModule mod_headers.c>
        <FilesMatch "\.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
    </IfModule>
    
    # 숨김 파일 접근 차단
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    
    # 설정 파일 접근 차단
    <FilesMatch "\.(json|md|lock|yaml|yml)$">
        Require all denied
    </FilesMatch>
    
    # 소스 디렉토리 접근 차단
    <Directory /var/www/html/ICM_SNG/src>
        Require all denied
    </Directory>
    
    # 에러 페이지
    ErrorDocument 404 /404.html
    ErrorDocument 500 /50x.html
    
    # 로그 설정
    ErrorLog ${APACHE_LOG_DIR}/icm-sng-error.log
    CustomLog ${APACHE_LOG_DIR}/icm-sng-access.log combined
</VirtualHost>