<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICM SNG Debug Page</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
            line-height: 1.6;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .success { background: #2d5a2d; }
        .error { background: #5a2d2d; }
        .info { background: #2d2d5a; }
        #console-output {
            background: #000;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>ICM SNG Debug Page</h1>
    <div id="debug-info"></div>
    
    <h2>Console Output</h2>
    <div id="console-output"></div>
    
    <h2>Module Loading Test</h2>
    <button onclick="testModuleLoading()">Test Module Loading</button>
    
    <script>
        const debugInfo = document.getElementById('debug-info');
        const consoleOutput = document.getElementById('console-output');
        
        // Capture console logs
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function addToConsole(type, args) {
            const time = new Date().toLocaleTimeString();
            const message = `[${time}] ${type.toUpperCase()}: ${Array.from(args).join(' ')}\n`;
            consoleOutput.textContent += message;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsole('log', args);
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addToConsole('error', args);
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addToConsole('warn', args);
        };
        
        // Basic environment checks
        function checkEnvironment() {
            const checks = [
                {
                    name: 'ES6 Modules Support',
                    test: () => typeof import !== 'undefined',
                    status: typeof import !== 'undefined'
                },
                {
                    name: 'Fetch API Support',
                    test: () => typeof fetch !== 'undefined',
                    status: typeof fetch !== 'undefined'
                },
                {
                    name: 'Local Storage Support',
                    test: () => typeof localStorage !== 'undefined',
                    status: typeof localStorage !== 'undefined'
                },
                {
                    name: 'Current Location',
                    test: () => window.location.href,
                    status: window.location.href
                },
                {
                    name: 'User Agent',
                    test: () => navigator.userAgent,
                    status: navigator.userAgent
                }
            ];
            
            let html = '';
            checks.forEach(check => {
                const isError = typeof check.status === 'boolean' && !check.status;
                html += `<div class="status ${isError ? 'error' : 'success'}">
                    <strong>${check.name}:</strong> ${check.status}
                </div>`;
            });
            
            debugInfo.innerHTML = html;
        }
        
        async function testModuleLoading() {
            console.log('Testing module loading...');
            
            try {
                // Test main.js loading
                console.log('Attempting to load main.js...');
                const mainModule = await import('/src/js/main.js');
                console.log('✅ main.js loaded successfully', mainModule);
            } catch (error) {
                console.error('❌ Failed to load main.js:', error);
            }
            
            try {
                // Test scenario.js loading
                console.log('Attempting to load scenario.js...');
                const scenarioModule = await import('/src/js/scenario.js');
                console.log('✅ scenario.js loaded successfully', scenarioModule);
            } catch (error) {
                console.error('❌ Failed to load scenario.js:', error);
            }
            
            try {
                // Test scenarios.json loading
                console.log('Attempting to fetch scenarios.json...');
                const response = await fetch('/src/data/scenarios.json');
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ scenarios.json loaded successfully, scenarios:', data.scenarios?.length || 0);
                } else {
                    console.error('❌ Failed to fetch scenarios.json:', response.status);
                }
            } catch (error) {
                console.error('❌ Error fetching scenarios.json:', error);
            }
        }
        
        // Run environment checks on load
        checkEnvironment();
        
        console.log('Debug page loaded successfully');
        console.log('Click "Test Module Loading" to test ES6 module imports');
    </script>
</body>
</html>
